asyncapi: 3.0.0
info:
  title: CinemaAbyss Events API
  version: 1.0.0
  description: |-
    API спецификация для системы CinemaAbyss, включающая монолит и микросервисы.
    
    Система CinemaAbyss представляет собой платформу для управления фильмами, пользователями, платежами и подписками.
    Архитектура системы включает монолитное приложение и выделенные микросервисы.

defaultContentType: application/json

servers:
  kafkaServer:
    host: kafka:9092
    protocol: PLAINTEXT
    description: msg broker

channels:
  users:
    address: event.users
    messages:
      UserEvent:
        $ref: '#/components/messages/UserEvent'
    description: The topic on which measured values may be produced and consumed.

  payments:
    address: event.payments
    messages:
      PaymentEvent:
        $ref: '#/components/messages/PaymentEvent'
    description: The topic on which measured values may be produced and 

  movies:
    address: event.movies
    messages:
      MovieEvent:
        $ref: '#/components/messages/MovieEvent'
    description: The topic on which measured values may be produced and 

operations:
  userEvent:
    description: 'user event'
    action: send
    channel:
      $ref: '#/channels/users'
    summary: >-
      Inform about environmental lighting conditions of a particular
      streetlight.
    traits:
      - $ref: '#/components/operationTraits/kafka'
    messages:
      - $ref: '#/channels/users/messages/UserEvent'
  paymentEvent:
    description: 'payment event'
    action: send
    channel:
      $ref: '#/channels/payments'
    traits:
      - $ref: '#/components/operationTraits/kafka'
    messages:
      - $ref: '#/channels/payments/messages/PaymentEvent'
  movieEvent:
    description: 'movie event'
    action: send
    channel:
      $ref: '#/channels/movies'
    traits:
      - $ref: '#/components/operationTraits/kafka'
    messages:
      - $ref: '#/channels/movies/messages/MovieEvent'
components:
  messages:
    UserEvent:
      name: Event
      title: Send user event
      summary: >-
        Inform about environmental lighting conditions of a particular
        streetlight.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/UserEvent'
    PaymentEvent:
      name: Event
      title: Send payment event
      summary: >-
        Inform about environmental lighting conditions of a particular
        streetlight.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PaymentEvent'
    MovieEvent:
      name: Event
      title: Send movie event
      summary: >-
        Inform about environmental lighting conditions of a particular
        streetlight.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MovieEvent'
  schemas:
    # Модели событий
    Event:
      type: object
      properties:
        id:
          type: string
          description: Уникальный идентификатор события
          example: "movie-1-viewed"
        type:
          type: string
          description: Тип события
          example: "movie"
        timestamp:
          type: string
          format: date-time
          description: Время события
          example: "2023-01-15T14:30:00Z"
        payload:
          type: object
          description: Полезная нагрузка события (зависит от типа события)
      required:
        - id
        - type
        - timestamp
        - payload

    MovieEvent:
      type: object
      properties:
        movie_id:
          type: integer
          description: Идентификатор фильма
          example: 1
        title:
          type: string
          description: Название фильма
          example: "Inception"
        action:
          type: string
          description: Действие с фильмом
          example: "viewed"
        user_id:
          type: integer
          description: Идентификатор пользователя (опционально)
          example: 1
        rating:
          type: number
          format: float
          description: Рейтинг (опционально)
          example: 8.5
        genres:
          type: array
          description: Жанры фильма (опционально)
          items:
            type: string
          example: ["Sci-Fi", "Action"]
        description:
          type: string
          description: Описание фильма (опционально)
          example: "A mind-bending thriller"
      required:
        - movie_id
        - title
        - action

    UserEvent:
      type: object
      properties:
        user_id:
          type: integer
          description: Идентификатор пользователя
          example: 1
        username:
          type: string
          description: Имя пользователя (опционально)
          example: "john_doe"
        email:
          type: string
          description: Email пользователя (опционально)
          example: "john.doe@example.com"
        action:
          type: string
          description: Действие пользователя
          example: "registered"
        timestamp:
          type: string
          format: date-time
          description: Время события
          example: "2023-01-15T14:30:00Z"
      required:
        - user_id
        - action
        - timestamp

    PaymentEvent:
      type: object
      properties:
        payment_id:
          type: integer
          description: Идентификатор платежа
          example: 1
        user_id:
          type: integer
          description: Идентификатор пользователя
          example: 1
        amount:
          type: number
          format: float
          description: Сумма платежа
          example: 9.99
        status:
          type: string
          description: Статус платежа
          example: "completed"
        timestamp:
          type: string
          format: date-time
          description: Время платежа
          example: "2023-01-15T14:30:00Z"
        method_type:
          type: string
          description: Тип метода оплаты (опционально)
          example: "credit_card"
      required:
        - payment_id
        - user_id
        - amount
        - status
        - timestamp

    EventResponse:
      type: object
      properties:
        status:
          type: string
          description: Статус операции
          example: "success"
        partition:
          type: integer
          description: Партиция Kafka
          example: 0
        offset:
          type: integer
          description: Смещение в партиции Kafka
          example: 42
        event:
          $ref: '#/components/schemas/Event'
      required:
        - status
        - partition
        - offset
        - event

    Error:
      type: object
      properties:
        error:
          type: string
          description: Сообщение об ошибке
          example: "Internal Server Error"
      required:
        - error
  operationTraits:
    kafka:
      bindings:
        kafka:
          clientId:
            type: string
            enum:
              - my-app-id
